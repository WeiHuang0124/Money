name = "finance-briefing"
main = "worker.js"
compatibility_date = "2026-01-01"

# 你的 Cloudflare 帳號（可用 `wrangler whoami` 確認）
account_id = "a497d6c3c379633aa7a97bce66faf1aa"

# 定時抓資料（UTC 時間）
#   0 6  = 台北 14:00，台股收盤後 → 抓當日台股
#   0 0  = 台北 08:00，美股隔夜收盤後 → 更新美股/幣
[triggers]
crons = ["0 6 * * *", "0 0 * * *"]

# KV：先建立再把 id 貼進來
#   wrangler kv namespace create BRIEFING
[[kv_namespaces]]
binding = "BRIEFING"
id = "<執行上面指令後貼上你的 KV id>"

# 可選變數：判讀用的模型（不設就用 haiku）
[vars]
MODEL = "claude-haiku-4-5-20251001"

# Secrets 不寫在這裡，用指令設定：
#   wrangler secret put ANTHROPIC_API_KEY   ← 有才會做 AI 判讀
#   wrangler secret put REFRESH_TOKEN       ← 保護手動刷新端點（可選）
