<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的理財</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FBFAF7;--ink:#1A2420;--sub:#5C625E;--mut:#8A8F8B;--line:#E5E2D9;--card:#FFFFFF;
    --teal:#0F6E56;--teal-bg:#E4F1EC;--coral:#C4571F;--gold:#B8892B;--green:#2E8B57;--red:#B4322A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;padding:18px 14px 44px;max-width:580px;margin:0 auto}
  .num{font-variant-numeric:tabular-nums lining-nums}
  h1{font-size:20px;font-weight:700;margin:0 0 2px}
  .hi{color:var(--sub);font-size:13px;margin:0 0 14px}
  .banner{background:var(--teal-bg);border:1px solid #Bfe0d3;border-radius:11px;padding:11px 13px;font-size:13px;color:var(--teal);margin-bottom:14px;display:none}
  .banner.show{display:block}

  .hero{background:linear-gradient(145deg,#124637,#0F6E56);color:#fff;border-radius:16px;padding:15px 17px;margin-bottom:12px}
  .hero .lab{font-size:12.5px;opacity:.85}
  .hero .big{font-size:32px;font-weight:900;line-height:1.1;margin:2px 0 3px}
  .hero .foot{font-size:12px;opacity:.85}
  .hero.over{background:linear-gradient(145deg,#8a2b24,#B4322A)}
  .hbar{height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden;margin-top:8px}
  .hbar-f{height:100%;background:linear-gradient(90deg,#2FD8A0,#F2C24B);border-radius:99px;width:2%;transition:width .5s}

  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;text-align:center;font-family:inherit;font-size:13.5px;font-weight:500;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 0;cursor:pointer}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:700}
  .panel{display:none}.panel.on{display:block}

  .env{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:9px}
  .env-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .env-name{font-size:15px;font-weight:700}
  .env-fig .rem{font-weight:700}.env-fig .bud{color:var(--mut)}
  .track{height:8px;background:#EEEBE2;border-radius:99px;overflow:hidden}
  .fill{height:100%;border-radius:99px;width:0;transition:width .5s}
  .env-add{margin-top:9px;display:flex;gap:7px}
  .env-add input{flex:1;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;min-width:0}
  .env-add button{font-family:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--teal);border:none;border-radius:9px;padding:8px 14px;cursor:pointer}

  .log-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
  .del{background:none;border:none;color:var(--mut);cursor:pointer;font-size:15px;padding:2px 4px}

  .settle{width:100%;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--gold);border:none;border-radius:12px;padding:14px;cursor:pointer;margin:6px 0 10px}
  .settle-card{background:#FBF4E4;border:1px solid #E4CE93;border-radius:13px;padding:15px 16px;margin-bottom:10px;display:none}
  .settle-card.show{display:block}
  .settle-card h3{margin:0 0 9px;font-size:15px;color:var(--gold)}
  .settle-card .row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
  .settle-card .tot{font-size:15px;font-weight:700;color:var(--teal);margin-top:8px;padding-top:8px;border-top:2px solid #E4CE93;display:flex;justify-content:space-between}
  .settle-card .sub{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}

  .mrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px;margin-bottom:7px}
  .mrow.ms{border-color:var(--gold);background:#FBF4E4}
  .m-date{font-size:14px;font-weight:700;width:70px;flex:0 0 auto}
  .m-in{flex:1}.m-in label{font-size:11px;color:var(--mut);display:block}
  .m-in input{width:105px;font-family:inherit;font-size:15px;font-weight:700;color:var(--teal);border:none;border-bottom:1px solid var(--line);background:none;outline:none;font-variant-numeric:tabular-nums}
  .m-cum{text-align:right}.m-cum .c{font-size:15px;font-weight:700}.m-cum .l{font-size:10px;color:var(--mut)}
  .m-badge{font-size:10px;font-weight:700;color:#fff;background:var(--gold);border-radius:99px;padding:2px 7px;margin-top:2px;display:inline-block}

  .set-g{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px}
  .set-g h3{margin:0 0 10px;font-size:14px;font-weight:700}
  .fld{margin-bottom:10px}
  .fld label{font-size:12.5px;color:var(--sub);display:block;margin-bottom:3px}
  .fld input{width:100%;font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
  .fld input:focus{border-color:var(--teal)}
  .two{display:flex;gap:8px}.two .fld{flex:1}
  .env-edit{display:flex;gap:7px;align-items:center;margin-bottom:7px}
  .env-edit input.n{flex:2}.env-edit input.b{flex:1;text-align:right}
  .env-edit input{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:8px 9px;outline:none;min-width:0}
  .env-edit .x{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;flex:0 0 auto;padding:0 2px}
  .addbtn{width:100%;font-family:inherit;font-size:14px;font-weight:700;color:var(--teal);background:var(--teal-bg);border:1px dashed #9FD8C4;border-radius:9px;padding:10px;cursor:pointer;margin-top:2px}
  .savebtn{width:100%;font-family:inherit;font-size:15px;font-weight:700;color:#fff;background:var(--teal);border:none;border-radius:11px;padding:13px;cursor:pointer;margin-top:6px}
  .note{font-size:11.5px;color:var(--mut);line-height:1.7;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
</style>

<h1 id="title">我的理財</h1>
<p class="hi" id="hi">記帳、存錢，全部自己設定</p>
<div class="banner" id="banner">👋 第一次使用？先到下方 <b>設定</b> 填你的月薪、信封和存錢目標，就是你自己的了。</div>

<div class="tabs">
  <button class="tab on" data-p="spend">記帳</button>
  <button class="tab" data-p="save">存錢</button>
  <button class="tab" data-p="set">設定</button>
</div>

<!-- 記帳 -->
<div class="panel on" id="spend">
  <div class="hero" id="spendHero">
    <div class="lab">本月生活費還可以花</div>
    <div class="big num">NT$<span id="remainTotal">0</span></div>
    <div class="foot num">預算 <span id="budTotal">0</span> · 已花 <span id="spentTotal">0</span></div>
  </div>
  <div id="envs"></div>
  <div style="font-size:13px;font-weight:700;color:var(--mut);margin:14px 2px 8px">最近記帳</div>
  <div id="log"></div>
  <button class="settle" id="settleBtn">📊 月底結算 · 算我這個月能存多少</button>
  <div class="settle-card" id="settleCard"></div>
</div>

<!-- 存錢 -->
<div class="panel" id="save">
  <div class="hero">
    <div class="lab">目前存款</div>
    <div class="big num">NT$<span id="cum">0</span></div>
    <div class="foot"><span id="goalLab">目標</span> · <span id="goalPct">0%</span></div>
    <div class="hbar"><div class="hbar-f" id="cumBar"></div></div>
  </div>
  <div id="months"></div>
</div>

<!-- 設定 -->
<div class="panel" id="set">
  <div class="set-g"><h3>基本</h3>
    <div class="fld"><label>你的名字（顯示用）</label><input id="s-name" placeholder="例：小美"></div>
    <div class="fld"><label>每月收入</label><input id="s-income" inputmode="numeric" placeholder="40000"></div>
  </div>
  <div class="set-g"><h3>每月先存（先存再花）</h3>
    <div class="two">
      <div class="fld"><label>每月先存金額</label><input id="s-save" inputmode="numeric" placeholder="5000"></div>
      <div class="fld"><label>存去哪個戶頭</label><input id="s-acct" placeholder="存款戶頭"></div>
    </div>
  </div>
  <div class="set-g"><h3>信封（生活費分類）</h3>
    <div id="envEdit"></div>
    <button class="addbtn" id="addEnv">＋ 新增信封</button>
  </div>
  <div class="set-g"><h3>存錢目標</h3>
    <div class="two">
      <div class="fld"><label>目標名稱</label><input id="s-goalname" placeholder="例：買車 / 旅遊 / 緊急金"></div>
      <div class="fld"><label>目標金額</label><input id="s-goaltarget" inputmode="numeric" placeholder="200000"></div>
    </div>
  </div>
  <button class="savebtn" id="saveSettings">儲存設定</button>
</div>

<p class="note">
  資料存在你自己的手機（localStorage），跟別人分開。換手機不會同步。<br>
  存款建議放高活存，別進股市或幣。這是記帳工具，不是投資建議。
</p>

<script>
  const Store={mem:{},get(k){try{return localStorage.getItem(k);}catch(e){return this.mem[k]??null;}},
    set(k,v){try{localStorage.setItem(k,v);}catch(e){this.mem[k]=v;}}};
  const KEY='myfin-v1';
  const DEFAULT={
    profile:{name:'',income:40000},
    saverule:{amount:5000,acct:'存款戶頭'},
    envelopes:[{id:'e1',name:'餐飲',budget:5000},{id:'e2',name:'交通',budget:2000},
      {id:'e3',name:'娛樂',budget:2000},{id:'e4',name:'日用',budget:1500},{id:'e5',name:'其他',budget:1000}],
    goal:{name:'存錢目標',target:200000},
    saves:{}, tx:[], month:curMonth(), setup:false
  };
  let state=JSON.parse(JSON.stringify(DEFAULT));
  function curMonth(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1);}
  const grp=n=>Math.round(n).toLocaleString('en-US');
  const parse=s=>parseInt(String(s).replace(/[^0-9]/g,''),10)||0;

  function load(){const v=Store.get(KEY);if(v){try{state=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),JSON.parse(v));}catch(e){}}
    if(state.month!==curMonth()){state.tx=[];state.month=curMonth();save();}}
  function save(){Store.set(KEY,JSON.stringify(state));}
  const spentOf=id=>state.tx.filter(t=>t.cat===id).reduce((s,t)=>s+t.amt,0);

  // 月份清單（從本月起 18 個月）
  function genMonths(){const out=[];const d=new Date();let y=d.getFullYear(),m=d.getMonth()+1;
    for(let i=0;i<18;i++){out.push({key:y+'-'+m,label:y+'/'+String(m).padStart(2,'0')});m++;if(m>12){m=1;y++;}}return out;}
  function savedFor(k){return state.saves[k]!=null?state.saves[k]:state.saverule.amount;}

  function renderHeader(){
    document.getElementById('title').textContent=state.profile.name?state.profile.name+' 的理財':'我的理財';
    document.getElementById('banner').classList.toggle('show',!state.setup);
  }
  function renderSpend(){
    let budT=0,spentT=0;const box=document.getElementById('envs');box.innerHTML='';
    state.envelopes.forEach(e=>{
      const sp=spentOf(e.id),rem=e.budget-sp;budT+=e.budget;spentT+=sp;
      const pct=e.budget>0?Math.min(100,sp/e.budget*100):0;
      const col=pct>=100?'var(--red)':pct>=80?'var(--gold)':'var(--teal)';
      const el=document.createElement('div');el.className='env';
      el.innerHTML='<div class="env-top"><div class="env-name">'+e.name+'</div>'+
        '<div class="env-fig num">剩 <span class="rem" style="color:'+(rem<0?'var(--red)':'var(--ink)')+'">'+grp(rem)+'</span> <span class="bud">/ '+grp(e.budget)+'</span></div></div>'+
        '<div class="track"><div class="fill" style="width:'+pct+'%;background:'+col+'"></div></div>'+
        '<div class="env-add"><input type="text" inputmode="numeric" placeholder="金額" data-amt="'+e.id+'">'+
        '<input type="text" placeholder="備註（可空）" data-note="'+e.id+'"><button data-add="'+e.id+'">＋</button></div>';
      box.appendChild(el);
    });
    const rem=budT-spentT;
    document.getElementById('remainTotal').textContent=grp(rem);
    document.getElementById('budTotal').textContent=grp(budT);
    document.getElementById('spentTotal').textContent=grp(spentT);
    document.getElementById('spendHero').classList.toggle('over',rem<0);
    box.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
      const id=b.dataset.add,ai=box.querySelector('[data-amt="'+id+'"]'),ni=box.querySelector('[data-note="'+id+'"]');
      const amt=parse(ai.value);if(!amt)return;
      state.tx.unshift({cat:id,amt,note:ni.value.trim(),ts:Date.now()});save();renderSpend();renderLog();});
    renderLog();
  }
  function renderLog(){
    const box=document.getElementById('log');
    if(!state.tx.length){box.innerHTML='<div style="font-size:12.5px;color:var(--mut);padding:2px">還沒有記錄。</div>';return;}
    box.innerHTML='';
    state.tx.slice(0,12).forEach((t,i)=>{const e=state.envelopes.find(x=>x.id===t.cat);const d=new Date(t.ts);
      const el=document.createElement('div');el.className='log-item';
      el.innerHTML='<div>'+(e?e.name:'?')+(t.note?' · '+t.note:'')+' <span style="color:#B8B4AA">'+(d.getMonth()+1)+'/'+d.getDate()+'</span></div>'+
        '<div><span class="num" style="font-weight:700">−'+grp(t.amt)+'</span> <button class="del" data-i="'+i+'">✕</button></div>';
      box.appendChild(el);});
    box.querySelectorAll('.del').forEach(b=>b.onclick=()=>{state.tx.splice(+b.dataset.i,1);save();renderSpend();});
  }
  document.getElementById('settleBtn').onclick=()=>{
    const budT=state.envelopes.reduce((s,e)=>s+e.budget,0);
    const spentT=state.envelopes.reduce((s,e)=>s+spentOf(e.id),0);
    const leftover=budT-spentT;const fixed=state.saverule.amount;const acct=state.saverule.acct||'存款戶頭';
    const card=document.getElementById('settleCard');
    let html='<h3>月底結算 · 該存多少</h3><div class="row"><span>發薪日已先存 → '+acct+'</span><b class="num">'+grp(fixed)+'</b></div>';
    if(leftover>=0){html+='<div class="row"><span>本月生活省下 → 再存進 '+acct+'</span><b class="num" style="color:var(--green)">＋'+grp(leftover)+'</b></div>'+
      '<div class="tot"><span>這個月共存</span><span class="num">'+grp(fixed+leftover)+'</span></div>'+
      '<p class="sub">👉 月底把 <b>'+grp(leftover)+'</b> 從生活帳戶再轉進「'+acct+'」。加上發薪日那 '+grp(fixed)+'，這個月共存 '+grp(fixed+leftover)+'。可到「存錢」分頁把這個月的存入改成這個數字。</p>';}
    else{html+='<div class="row"><span>本月超支</span><b class="num" style="color:var(--red)">'+grp(leftover)+'</b></div>'+
      '<p class="sub">⚠️ 這個月生活費超支 '+grp(-leftover)+'。這個月只存發薪日那 '+grp(fixed)+'，下個月把最容易超的信封收緊一點。</p>';}
    card.innerHTML=html;card.classList.add('show');card.scrollIntoView({behavior:'smooth',block:'center'});
  };

  function renderSave(){
    const box=document.getElementById('months');box.innerHTML='';let cum=0;const crossed=new Set();
    const target=state.goal.target||0;
    genMonths().forEach(mo=>{
      const val=savedFor(mo.key);cum+=val;
      let hit='';if(target&&cum>=target&&!crossed.has(target)){crossed.add(target);hit='達標 🎉';}
      const el=document.createElement('div');el.className='mrow'+(hit?' ms':'');
      el.innerHTML='<div class="m-date">'+mo.label+'</div>'+
        '<div class="m-in"><label>這個月存入</label><input type="text" inputmode="numeric" data-k="'+mo.key+'" value="'+grp(val)+'"></div>'+
        '<div class="m-cum"><div class="c num">'+grp(cum)+'</div><div class="l">累計</div>'+(hit?'<div class="m-badge">'+hit+'</div>':'')+'</div>';
      box.appendChild(el);
    });
    box.querySelectorAll('input[data-k]').forEach(inp=>{inp.onblur=()=>{state.saves[inp.dataset.k]=parse(inp.value);save();renderSave();};
      inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};});
    // hero
    let total=0;genMonths().forEach(mo=>total+=savedFor(mo.key));
    document.getElementById('cum').textContent=grp(total);
    document.getElementById('goalLab').textContent=state.goal.name+' '+grp(target);
    const pct=target?Math.min(100,Math.round(total/target*100)):0;
    document.getElementById('goalPct').textContent=pct+'%';
    document.getElementById('cumBar').style.width=Math.max(2,pct)+'%';
  }

  // 設定
  function renderSettings(){
    document.getElementById('s-name').value=state.profile.name||'';
    document.getElementById('s-income').value=state.profile.income||'';
    document.getElementById('s-save').value=state.saverule.amount||'';
    document.getElementById('s-acct').value=state.saverule.acct||'';
    document.getElementById('s-goalname').value=state.goal.name||'';
    document.getElementById('s-goaltarget').value=state.goal.target||'';
    renderEnvEdit();
  }
  function renderEnvEdit(){
    const box=document.getElementById('envEdit');box.innerHTML='';
    state.envelopes.forEach((e,i)=>{const el=document.createElement('div');el.className='env-edit';
      el.innerHTML='<input class="n" value="'+e.name.replace(/"/g,'&quot;')+'" data-n="'+i+'"><input class="b" inputmode="numeric" value="'+e.budget+'" data-b="'+i+'"><button class="x" data-x="'+i+'">✕</button>';
      box.appendChild(el);});
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{state.envelopes.splice(+b.dataset.x,1);renderEnvEdit();});
  }
  document.getElementById('addEnv').onclick=()=>{state.envelopes.push({id:'e'+Date.now(),name:'新信封',budget:1000});renderEnvEdit();};
  document.getElementById('saveSettings').onclick=()=>{
    state.profile.name=document.getElementById('s-name').value.trim();
    state.profile.income=parse(document.getElementById('s-income').value);
    state.saverule.amount=parse(document.getElementById('s-save').value);
    state.saverule.acct=document.getElementById('s-acct').value.trim()||'存款戶頭';
    state.goal.name=document.getElementById('s-goalname').value.trim()||'存錢目標';
    state.goal.target=parse(document.getElementById('s-goaltarget').value);
    // 收集信封編輯
    const box=document.getElementById('envEdit');const rows=[...box.querySelectorAll('.env-edit')];
    state.envelopes=rows.map((r,i)=>({id:state.envelopes[i]?state.envelopes[i].id:'e'+Date.now()+i,
      name:r.querySelector('.n').value.trim()||'信封',budget:parse(r.querySelector('.b').value)}));
    state.setup=true;save();
    renderHeader();renderSpend();renderSave();
    alert('設定已儲存！');
    document.querySelector('.tab[data-p="spend"]').click();
  };

  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    document.getElementById(b.dataset.p).classList.add('on');
    if(b.dataset.p==='set')renderSettings();
    if(b.dataset.p==='save')renderSave();});

  load();renderHeader();renderSpend();renderSave();renderSettings();
</script>
